[project]
name = "audiosanity"
version = "0.1.0"
description = "Sanity-check battery for attribution maps of audio classifiers (SIWY 2026Z, project X3)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Mariusz Pakulski" },
    { name = "Filip Misztal" },
    { name = "Paweł Łasica" },
]
dependencies = [
    "torch>=2.7",
    "transformers>=4.45",
    "captum>=0.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "soundfile>=0.12",
    "omegaconf>=2.3",
    "typer>=0.12",
    "tqdm>=4.66",
    "tensorboard>=2.16",
]

[project.scripts]
audiosanity = "audiosanity.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiosanity"]

# CUDA 12.8 wheels (needed for RTX 50xx / Blackwell, work on older GPUs too).
# On macOS uv falls back to the default PyPI CPU/MPS wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
